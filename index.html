<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game of Life</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <!--
      Implement Conway's Game of Life here, following README.md.

      Everything (HTML, CSS, JS) must live in this single file:
        - no external requests, no libraries, no build step
        - must run from file:// offline

      Optional: expose `window.gameOfLifeStep(cells)` so glider-test.html
      can verify your rules automatically (see README.md).
    -->
    <main class="app">
      <h1>Conway&rsquo;s Game of Life</h1>

      <!-- Simulation controls and speed slider. -->
      <div
        id="toolbar"
        class="toolbar"
        role="toolbar"
        aria-label="Simulation controls"
      >
        <button id="start-btn" type="button" aria-label="Start simulation">Start</button>
        <button id="stop-btn" type="button" aria-label="Stop simulation">Stop</button>
        <button id="step-btn" type="button" aria-label="Advance one generation">Step</button>
        <button id="reset-btn" type="button" aria-label="Reset to initial pattern">Reset</button>
        <button id="clear-btn" type="button" aria-label="Clear the grid">Clear</button>

        <label class="speed-control" for="speed-slider">
          <span class="speed-label">Speed</span>
          <input
            id="speed-slider"
            type="range"
            min="50"
            max="1000"
            step="10"
            value="200"
            aria-label="Tick interval in milliseconds"
          />
          <span id="speed-value" class="speed-value">200ms</span>
        </label>
      </div>

      <div id="grid" class="grid-container" aria-label="Game of Life grid"></div>

      <footer class="attribution">Built by Coroid</footer>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
